<header class="topbar">
  <a routerLink="/" class="topbar__brand">
<img src="assets/images/Logo.png" alt="Logo" class="topbar__logo">
    <span class="topbar__wordmark">شركة الأخشاب</span>
  </a>

  <nav class="topbar__nav">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
      المنتجات
    </a>
    <a routerLink="/services" routerLinkActive="is-active">الخدمات</a>

    @if (auth.currentUser()) {
      <a routerLink="/orders" routerLinkActive="is-active">طلباتي</a>
      <a routerLink="/quotes" routerLinkActive="is-active">عروض الأسعار</a>
    }
  </nav>

  <div class="topbar__actions">
    <a routerLink="/cart" class="topbar__cart" aria-label="السلة">
      <span>السلة</span>
      @if (cart.itemCount() > 0) {
        <span class="topbar__cart-badge">{{ cart.itemCount() }}</span>
      }
    </a>

    @if (auth.currentUser(); as user) {
      <div class="topbar__user">
        <span class="topbar__user-role">
  {{ user.role }}
</span>
        <button type="button" class="topbar__logout" (click)="logout()">خروج</button>
      </div>
    } @else {
      <a routerLink="/login" class="topbar__link">تسجيل الدخول</a>
      <a routerLink="/register" class="topbar__btn">إنشاء حساب</a>
    }
  </div>
</header>
